name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - rankings.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# shared with refresh.yml so the two never run at once; queue: max keeps
# every run queued instead of replacing the pending one
concurrency:
  group: rankings-pipeline
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir site
          cp index.html site/
          cp rankings.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
