[project]
name = "dynasty-draft-2026"
version = "0.1.0"
description = "Draft pool, live board, and VOR rankings for a 10-team superflex dynasty league"
readme = "README.md"
requires-python = ">=3.12"

# Stdlib only, on purpose: the html parse uses html.parser, both fetches use
# urllib.request, and the ranker is arithmetic. Nothing here needs a wheel.
dependencies = []

[tool.uv]
# A folder of scripts, not an importable package — there is nothing to build or
# install, and each pipeline is run by path (`uv run pool_pipeline/pipeline.py`).
package = false
